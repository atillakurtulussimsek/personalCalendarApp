version: "2"
sql:
  - engine: "mysql"
    schema: "internal/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_interface: true
        overrides:
          - db_type: "json"
            go_type: "encoding/json.RawMessage"
